<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#1976d2" />
    <!-- Anti-FOUC: resuelve el esquema (localStorage 'mui-mode' -> sistema)
         ANTES del primer paint, con el mismo contrato que el ThemeProvider de
         MUI (colorSchemeSelector 'data'). Debe ser inline y sincrónico. -->
    <script>
      (function () {
        var dark = false;
        try {
          var mode = localStorage.getItem('mui-mode') || 'system';
          dark =
            mode === 'dark' ||
            (mode !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {
          /* storage bloqueado: queda claro */
        }
        document.documentElement.setAttribute(
          'data-mui-color-scheme',
          dark ? 'dark' : 'light'
        );
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#1e1e1e' : '#1976d2');
      })();
    </script>
    <style>
      /* Fondo pre-JS: que la pantalla de carga en 3G ya salga en el esquema
         correcto. El valor final lo pisa CssBaseline al montar React. */
      html[data-mui-color-scheme='dark'] body {
        background-color: #121212;
      }
    </style>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ripser App" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Ripser App</title>
  </head>
  <body class="notranslate">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
