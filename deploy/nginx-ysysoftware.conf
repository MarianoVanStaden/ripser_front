# ============================================================================
# ysysoftware.com — landing en / + SPA RipserApp bajo /ripser
# Server block COMPLETO post-cutover, basado en el /etc/nginx/sites-enabled/
# ysysoftware real del VPS (certbot incluido). Reemplaza a ese archivo vía
# deploy/scripts (el original queda backupeado para rollback).
#
# Layout en disco:
#   /var/www/landing/current           ← landing (+ sw.js kill-switch)
#   /var/www/app/current/ripser/       ← dist de la SPA (symlink por release)
# ============================================================================

server {
    server_name ysysoftware.com www.ysysoftware.com;
    client_max_body_size 10M;

    root /var/www/landing/current;
    index index.html;
    # root/try_files sobre symlinks que rotan por release: sin esto nginx
    # puede cachear el fd del index viejo tras un swap.
    open_file_cache off;

    # ---- Raíz: sirve lo que exista físicamente en la landing; el resto 302 a
    # la app (bookmarks viejos: /dashboard, /login...). TEMPORAL: cuando la
    # landing esté completa, @to_ripser puede pasar a 404/landing.
    location / {
        try_files $uri $uri/ @to_ripser;
    }
    location @to_ripser {
        return 302 /ripser$request_uri;
    }

    # ---- KILL-SWITCH del SW viejo de la app (scope '/'). Nombre EXACTO del
    # SW pre-cutover (verificado: /var/www/frontend/current/sw.js).
    # no-store: el browser lo re-chequea en cada visita.
    # Mantener hasta retirar la landing legacy; ver deploy/sw-killswitch.js.
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ---- QRs YA IMPRESOS en equipos fabricados apuntan a
    # /public/equipos/<n>/ficha. Excepción DELIBERADA y PERMANENTE: NO es
    # candidata a limpieza — hay fichas físicas pegadas en heladeras que no se
    # pueden reimprimir. 301 (permanente) a la ruta nueva de la SPA.
    location /public/equipos/ {
        return 301 /ripser$request_uri;
    }

    # ========================================================================
    # SPA bajo /ripser
    # ========================================================================
    location = /ripser {
        return 302 /ripser/;
    }

    # index.html de la SPA: NUNCA cachear (los deploys rotan assets con hash;
    # un index viejo referencia chunks que ya no existen).
    # `location =` le gana al regex de assets de abajo — precedencia verificada.
    location = /ripser/index.html {
        root /var/www/app/current;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # SW de la app nueva: no-store por la misma razón que el kill-switch
    # (el browser decide updates por byte-diff del archivo).
    location = /ripser/sw.js {
        root /var/www/app/current;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location = /ripser/manifest.webmanifest {
        root /var/www/app/current;
        add_header Cache-Control "no-cache" always;
    }

    # Assets con hash en el nombre: cache agresivo e inmutable.
    # OJO precedencia: este regex le gana a `location /ripser/` (prefijo) pero
    # PIERDE contra los `location =` de arriba — por eso index/sw/manifest van
    # con match exacto.
    location ~* ^/ripser/(assets/|workbox-).*\.(js|css|woff2|png|svg|ico)$ {
        root /var/www/app/current;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ---- API: SSE primero (location = le gana al prefijo genérico).
    # El proxy_pass al backend NO cambia con el cutover: 127.0.0.1:8080
    # (loopback, igual que el config previo).
    location = /ripser/api/eventos/stream {
        proxy_pass http://127.0.0.1:8080/RipserApp/api/eventos/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Empresa-Id $http_x_empresa_id;
        proxy_set_header X-Sucursal-Id $http_x_sucursal_id;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        add_header Cache-Control "no-store" always;
    }

    location /ripser/api/ {
        proxy_pass http://127.0.0.1:8080/RipserApp/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Empresa-Id $http_x_empresa_id;
        proxy_set_header X-Sucursal-Id $http_x_sucursal_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    # Resto de la SPA: fallback al index (rutas client-side de react-router).
    location /ripser/ {
        root /var/www/app/current;
        try_files $uri $uri/ /ripser/index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ysysoftware.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ysysoftware.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.ysysoftware.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = ysysoftware.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name ysysoftware.com www.ysysoftware.com;
    return 404; # managed by Certbot
}
